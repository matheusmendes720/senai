[project]
name = "avaliacao-tui"
version = "0.1.0"
description = "TUI interativa para correção da Avaliação Parte 2 (Implantação de Sistemas — SENAI). Os 10 exercícios são programas em C compilados sob demanda."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matheus Mendes" },
]
dependencies = [
    "textual>=0.86,<1.0",
]

[project.scripts]
avaliacao-tui = "avaliacao_tui.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avaliacao_tui"]

[tool.hatch.build.targets.wheel.force-include]
"src/avaliacao_tui/exercicios" = "avaliacao_tui/exercicios"
